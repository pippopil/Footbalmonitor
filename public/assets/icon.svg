<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0f2b38" />
      <stop offset="55%" stop-color="#04121e" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="ballGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- App Icon Squircle Base with Soft Drop Shadow -->
  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#bgGlow)" filter="url(#softShadow)" />
  <rect x="16" y="16" width="480" height="480" rx="118" fill="none" stroke="#1e293b" stroke-width="4" />
  <rect x="20" y="20" width="472" height="472" rx="114" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.35" />

  <!-- Radar Grid Circles (Background telemetry) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="145" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="95" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 6" />

  <!-- Radar Sweep Cone -->
  <path d="M 256 256 L 390 120 A 190 190 0 0 0 256 66 Z" fill="url(#radarSweep)" opacity="0.35" />

  <!-- Tactical Hex Shield Container -->
  <path d="M256 68 L410 138 V270 C410 368 338 438 256 464 C174 438 102 368 102 270 V138 L256 68 Z"
        fill="#04131f" fill-opacity="0.88"
        stroke="url(#shieldBorder)" stroke-width="10" stroke-linejoin="round"
        filter="url(#glowEffect)" />

  <!-- Inner Soccer Ball Geodesic Geometry -->
  <g transform="translate(256, 252)">
    <!-- Central Hexagonal/Pentagonal Core -->
    <polygon points="0,-48 46,-15 28,40 -28,40 -46,-15" fill="url(#ballGrad)" stroke="#6ee7b7" stroke-width="5" />

    <!-- Seams radiating to outer ball points -->
    <line x1="0" y1="-48" x2="0" y2="-98" stroke="#34d399" stroke-width="5" stroke-linecap="round" />
    <line x1="46" y1="-15" x2="92" y2="-32" stroke="#34d399" stroke-width="5" stroke-linecap="round" />
    <line x1="28" y1="40" x2="68" y2="85" stroke="#34d399" stroke-width="5" stroke-linecap="round" />
    <line x1="-28" y1="40" x2="-68" y2="85" stroke="#34d399" stroke-width="5" stroke-linecap="round" />
    <line x1="-46" y1="-15" x2="-92" y2="-32" stroke="#34d399" stroke-width="5" stroke-linecap="round" />

    <!-- Outer Ball Connecting Arc Nodes -->
    <circle cx="0" cy="-98" r="8" fill="#a7f3d0" />
    <circle cx="92" cy="-32" r="8" fill="#a7f3d0" />
    <circle cx="68" cy="85" r="8" fill="#a7f3d0" />
    <circle cx="-68" cy="85" r="8" fill="#a7f3d0" />
    <circle cx="-92" cy="-32" r="8" fill="#a7f3d0" />

    <!-- Center Pulse Core -->
    <circle cx="0" cy="0" r="14" fill="#ffffff" filter="url(#glowEffect)" />
    <circle cx="0" cy="0" r="7" fill="#10b981" />
  </g>

  <!-- Live Signal Waveforms at Bottom of Shield -->
  <path d="M 172 388 Q 214 366 256 366 T 340 388" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 7" />
  <path d="M 194 410 Q 225 394 256 394 T 318 410" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" />

  <!-- Top Beacon Apex (Target Lock) -->
  <circle cx="256" cy="68" r="14" fill="url(#accentGold)" filter="url(#glowEffect)" />
  <circle cx="256" cy="68" r="6" fill="#ffffff" />

  <!-- High-Tech Target Crosshair Ticks -->
  <line x1="256" y1="28" x2="256" y2="48" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="464" x2="256" y2="484" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <line x1="28" y1="256" x2="48" y2="256" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <line x1="464" y1="256" x2="484" y2="256" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
</svg>
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Чёрный список лиг</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Управление чёрным списком лиг</h2>
    <a href="/" class="btn btn-secondary mb-3">Назад к фильтрам</a>
    <table class="table table-bordered">
        <thead>
            <tr><th>Лига</th><th>Действие</th></tr>
        </thead>
        <tbody>
            {% for league in all_leagues %}
            <tr>
                <td>{{ league.name }}</td>
                <td>
                    {% if league.id in blacklisted_ids %}
                    <form method="post" action="/blacklist/remove" style="display:inline;">
                        <input type="hidden" name="league_id" value="{{ league.id }}">
                        <button type="submit" class="btn btn-danger btn-sm">Удалить из чёрного списка</button>
                    </form>
                    {% else %}
                    <form method="post" action="/blacklist/add" style="display:inline;">
                        <input type="hidden" name="league_id" value="{{ league.id }}">
                        <input type="hidden" name="league_name" value="{{ league.name }}">
                        <button type="submit" class="btn btn-warning btn-sm">Добавить в чёрный список</button>
                    </form>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
